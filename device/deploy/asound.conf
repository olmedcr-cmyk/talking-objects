# /etc/asound.conf — the USB sound card as default device.
#
# install.sh replaces __CARD__ with the number it detects. To check by hand:
#   aplay -l     (output)
#   arecord -l   (input)
#
# `type hw` with no plug/dmix: the card accepts ONE opener, which is exactly
# what the audio owner thread wants. Nothing else should be playing sound.

pcm.!default {
  type hw
  card __CARD__
}
ctl.!default {
  type hw
  card __CARD__
}
