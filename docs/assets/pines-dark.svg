<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-label="Cabezal de 40 pines de la Raspberry Pi: número y nombre de cada pin, con los siete que usa el kit marcados y su función">
<style>
.face{fill:#000000;stroke:#474747;stroke-width:.9;stroke-linejoin:round}
.sil{fill:none;stroke-width:1.15;stroke-linejoin:round;stroke-linecap:round}
.sil.edge{stroke:#C6C5C0} .sil.hi{stroke:#F2F2F2;stroke-width:1.6}
.face.hi-fill{fill:#F2F2F2;stroke:#F2F2F2}
.line{fill:none;stroke:#474747;stroke-width:.9;stroke-linejoin:round}
.line.edge{stroke:#C6C5C0}
.wire{fill:none;stroke:#C6C5C0;stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
.wire.hi{stroke:#F2F2F2;stroke-width:1.6}
.ghost{fill:none;stroke:#474747;stroke-width:.9;stroke-dasharray:3 4}
.leader{fill:none;stroke:#474747;stroke-width:1}
.dot{fill:#F2F2F2}
.label{font:15px 'Roboto Mono', ui-monospace, Menlo, Consolas, monospace;fill:#C6C5C0;letter-spacing:.2px}
.label .idx{fill:#F2F2F2}
.sub{font:13px 'Roboto Mono', ui-monospace, Menlo, Consolas, monospace;fill:#C6C5C0;opacity:.8}
.title{font:15px 'Roboto Mono', ui-monospace, Menlo, Consolas, monospace;fill:#C6C5C0;letter-spacing:.6px}
.head{font:26px 'Bricolage Grotesque', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#F2F2F2;letter-spacing:-.4px}
.chip{font-family:'Roboto Mono', ui-monospace, Menlo, Consolas, monospace;fill:#C6C5C0}
.rule{stroke:#474747;stroke-width:1}
.arrow{fill:none;stroke:#F2F2F2;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}

.pin{fill:#000000;stroke:#C6C5C0;stroke-width:1.1}
.pin.power{stroke-dasharray:2 2}
.frame{fill:none;stroke:#474747;stroke-width:1}
.num{font:12px 'Roboto Mono', ui-monospace, Menlo, Consolas, monospace;fill:#C6C5C0}
.num-used{fill:#000000}
.pname{font:14px 'Roboto Mono', ui-monospace, Menlo, Consolas, monospace;fill:#C6C5C0;opacity:.75}
.pname-used{font:14px 'Roboto Mono', ui-monospace, Menlo, Consolas, monospace;fill:#F2F2F2}
.use{font:15px 'Roboto Mono', ui-monospace, Menlo, Consolas, monospace;fill:#F2F2F2}
.pin-used{fill:#F2F2F2}
</style>
