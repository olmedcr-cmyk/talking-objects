<text class="sub" x="40.00" y="874.00" text-anchor="start">Pin 1 (cuadrado) en la esquina opuesta a los USB. Impares por dentro, pares por el borde de la placa.</text>
<text class="sub" x="40.00" y="898.00" text-anchor="start">Los pines 4 y 2 dan 5 V de la placa: valen para el LCD, no para la tira, que va con su propia fuente.</text>
<text class="sub" x="40.00" y="922.00" text-anchor="start">Desconecta la alimentación antes de cablear. Un 5 V en un pin de 3,3 V daña la placa.</text>
