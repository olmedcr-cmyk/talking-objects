<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660" role="img" aria-label="Cableado de referencia: Raspberry Pi 5 con LCD I2C, interruptor en GPIO17, tira WS2812E por SPI con convertidor de nivel y fuente de 5 V">
