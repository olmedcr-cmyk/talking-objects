<rect x="60" y="90" width="250" height="330" fill="#FFFFFF" stroke="#30302E" stroke-width="1"/><text x="72" y="112" class="t">Raspberry Pi 5</text><text x="72" y="132" class="m">cabecera de 40 pines</text><text x="300" y="154" class="m" text-anchor="end">pin 3 · GPIO2 SDA</text><circle cx="310" cy="150" r="2.5" fill="#8A8984"/><text x="300" y="184" class="m" text-anchor="end">pin 5 · GPIO3 SCL</text><circle cx="310" cy="180" r="2.5" fill="#8A8984"/><text x="300" y="214" class="m" text-anchor="end">pin 4 · 5 V</text><circle cx="310" cy="210" r="2.5" fill="#8A8984"/><text x="300" y="244" class="m" text-anchor="end">pin 6 · GND</text><circle cx="310" cy="240" r="2.5" fill="#8A8984"/><text x="300" y="294" class="m" text-anchor="end">pin 11 · GPIO17</text><circle cx="310" cy="290" r="2.5" fill="#8A8984"/><text x="300" y="324" class="m" text-anchor="end">pin 9 · GND</text><circle cx="310" cy="320" r="2.5" fill="#8A8984"/><text x="300" y="374" class="m" text-anchor="end">pin 19 · GPIO10 MOSI</text><circle cx="310" cy="370" r="2.5" fill="#8A8984"/><rect x="60" y="450" width="250" height="60" fill="#FFFFFF" stroke="#30302E" stroke-width="1"/><text x="72" y="472" class="t">USB</text><text x="72" y="492" class="m">tarjeta de sonido: micro y altavoz</text><rect x="520" y="110" width="220" height="120" fill="#FFFFFF" stroke="#30302E" stroke-width="1"/><text x="532" y="132" class="t">LCD 20x4 I2C</text><text x="532" y="152" class="m">PCF8574 · 0x27 o 0x3F</text><text x="532" y="168" class="m">SDA · SCL · VCC · GND</text><polyline points="310,150 520,150" fill="none" stroke="#8A8984" stroke-width="1.2"/><polyline points="310,180 520,180" fill="none" stroke="#8A8984" stroke-width="1.2"/><polyline points="310,210 470,210 470,200 520,200" fill="none" stroke="#8A8984" stroke-width="1.2"/><polyline points="310,240 490,240 490,215 520,215" fill="none" stroke="#8A8984" stroke-width="1.2"/><rect x="520" y="265" width="220" height="80" fill="#FFFFFF" stroke="#30302E" stroke-width="1"/><tex