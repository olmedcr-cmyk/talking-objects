    id: idea
    attributes:
      label: La idea
      description: Qué haría el objeto y en qué experiencia.
    validations: { required: true }
  - type: textarea
    id: hardware
    attributes:
      label: Hardware
      description: Pieza, conexión y librería, si las conoces.
